server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles or the source JSON used to build the site
    location ~ /\. {
        deny all;
    }
    location = /broker_ads_source.json {
        deny all;
    }
}
